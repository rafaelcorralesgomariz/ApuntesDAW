    <script>



        let cola = []
        const NUM_CLIENTES = 3
        for (let i = 0; i < NUM_CLIENTES ; i++) {
            cola.push("cliente"+(i+1))
             //Imprimir 
        let impresionCola = ""
        const SEPARADOR = "-"
        for (let i = 0; i < NUM_CLIENTES; i++) {
           impresionCola += cola[i] + SEPARADOR
        }

        alert(impresionCola)

        for (let i = 0; i < NUM_CLIENTES; i++) {
            clienteAtendido = cola.shift()
            console.log("Cliente atendido; " + clienteAtendido);
            console.log("Estado de la cola: " + cola);
            // "La cola ha sido atendida correctamente"
            if (i < (NUM_CLIENTES - 1)) 

            }
    
        
        }
            

        alert(impresionCola)
       
    
        
        while (cola.length > 0) {
         let atendido = cola.shift();
         alert (`Atendido: ${atendido}. Estado de la cola: 
         [${cola}]`);
         }

      //  1. cola.shift() es la clave: En una estructura de datos de tipo
       // cola (FIFO: el primero en entrar es el primero en salir), 
      //  no puedes usar un bucle for tradicional con cola[i].
        // Si usaras cola[i], estarías revisando al cliente pero no lo 
      //  estarías quitando de la fila. Al usar shift(), sacas literalmente 
         //al primer cliente de la lista.
//2. El problema del bucle for original: Si modificas el array dentro de 
//un bucle for convencional, su longitud (cola.length) se reduce en cada paso
// mientras tu índice i aumenta. Esto hace que el bucle se salte elementos o 
//  termine antes de tiempo. Por eso , es mucho más limpio usar un while 
//  (cola.length > 0), que significa: "mientras siga habiendo gente en la 
// cola,
//   sigue atendiendo" El shift siempre quita un elemento del principio 
//del array. 











    </script>
